name: Selenium Automation CI

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Choose the test suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          # Tells Java setup where to find the pom.xml for caching
          cache-dependency-path: 'project/pom.xml'

      - name: Set up Chrome Browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Selenium Tests
        # This line changes the execution directory to your subfolder!
        working-directory: ./project
        run: |
          SUITE_TYPE="${{ github.event.inputs.suite || 'smoke' }}"
          echo "Running $SUITE_TYPE tests inside the project folder..."
          mvn test -DsuiteXmlFile=${SUITE_TYPE}.xml

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          # Updated path to look inside the subfolder
          path: project/target/surefire-reports/