name: Selenium Automation CI

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      suite:
        description: 'Choose the test suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression

  # Automatically runs Smoke tests on every Pull Request to main
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven' # Change to 'gradle' if you use Gradle

      - name: Set up Chrome Browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Selenium Tests
        run: |
          # Determine which XML to run. 
          # If triggered by a PR, default to smoke. Otherwise, use the manual selection.
          SUITE_TYPE="${{ github.event.inputs.suite || 'smoke' }}"
          echo "Running $SUITE_TYPE tests..."
          
          # Maven command executing the specific XML
          mvn test -DsuiteXmlFile=${SUITE_TYPE}.xml

      - name: Upload Test Report
        if: always() # Ensures reports upload even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: target/surefire-reports/ # Change to build/reports/ if using Gradle